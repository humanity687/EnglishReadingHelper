{% extends "base.html" %}
{% block title %}正在记住 · {{ book.title }}{% endblock %}
{% block head %}
<meta http-equiv="refresh" content="8; url=/discuss/distill/status/{{ book.id }}">
{% endblock %}
{% block body %}
<div class="thinking">
  <div>正在记住已读内容…</div>
  <div class="hint">已完成 {{ done }} / {{ total }} 个场景（每个约 10-15 秒）</div>
  <div class="hint">页面每 8 秒自动刷新，完成后自动返回讨论页</div>
  <div class="hint"><a href="/discuss/{{ book.id }}">返回讨论页（可在后台继续）</a></div>
</div>
{% endblock %}
